name: Publish to GitHub Pages
on:
  push:
    branches: [main]
    # Only GA version tags (vMAJOR.MINOR.PATCH). Pre-release suffixes like
    # v1.0.0-rc1 or build-metadata suffixes like v1.0.0+meta must NOT publish
    # to production Pages — manifest-prod.js strips those suffixes and an RC
    # would collide with the eventual GA release. The glob narrows it down
    # and the job-level `if` below guards against `-` / `+` sneaking through.
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Skip pre-release / build-metadata tags (v1.0.0-rc1, v1.0.0+meta, ...).
    # Still run for branch pushes to main (where github.ref is refs/heads/main).
    if: ${{ github.ref_type != 'tag' || (!contains(github.ref_name, '-') && !contains(github.ref_name, '+')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Rewrite manifest URLs for production
        env:
          PLACEKEY_ADDIN_URL: ${{ vars.PLACEKEY_ADDIN_URL || 'https://placekey.github.io/placekey-excel-addon' }}
        run: npm run rewrite-manifest
      - name: Copy docs into dist (icons are served by Vite from public/)
        run: |
          cp -r docs/. dist/ 2>/dev/null || true
          cp docs/install.html dist/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
